<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SMS - Account Access Recovery Gateway</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .step-panel { display: none; }
        .step-panel.active-step { display: block; }
    </style>
</head>
<body>
<div class="wrapper">
    <h2>Account Recovery</h2>

    <!-- STEP 1: VERIFY TARGET ACCOUNT EMAIL ADDRESS -->
    <div id="recoveryStep1" class="step-panel active-step">
        <div class="field-group">
            <label>Registered Email Address</label>
            <input type="email" id="recoveryEmail" placeholder="name@gmail.com">
        </div>
        <button id="sendOtpTriggerBtn" class="login-btn" style="width:100%; padding:12px; background:#4f46e5; color:#fff; border:none; border-radius:6px; font-weight:700; cursor:pointer;">Request Security Verification OTP</button>
    </div>

    <!-- STEP 2: VERIFY OTP AND RESET SECURE PASSWORD -->
    <div id="recoveryStep2" class="step-panel">
        <p style="font-size:13px; color:#64748b; margin-bottom:15px;">🎉 Secure verification token OTP has been successfully transmitted onto your inbox ledger.</p>
        <div class="field-group"><label>Enter Verification 6-Digit OTP</label><input type="text" id="verificationOtpCode"></div>
        <div class="field-group"><label>Setup New Access Password</label><input type="password" id="recoveryNewPassword"></div>
        <button id="commitPasswordResetBtn" class="login-btn" style="width:100%; padding:12px; background:#10b981; color:#fff; border:none; border-radius:6px; font-weight:700; cursor:pointer;">Verify and Commit New Password</button>
    </div>

    <div id="recoveryStatusAlert" class="alert" style="display:none; margin-top:15px; padding:10px; border-radius:6px;"></div>
</div>

<script>
    let targetedRecoveryEmail = "";

    // Trigger Step 1 Pipeline Call
    document.getElementById('sendOtpTriggerBtn').addEventListener('click', async () => {
        const email = document.getElementById('recoveryEmail').value.trim();
        const alertBox = document.getElementById('recoveryStatusAlert');
        if(!email) return alert("Email fields cannot be empty!");

        try {
            const res = await fetch("http://localhost:8081/api/auth/forgot-password", {
                method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email })
            });
            const data = await res.json();
            alertBox.style.display = "block";

            if(data.success) {
                targetedRecoveryEmail = email;
                document.getElementById('recoveryStep1').classList.remove('active-step');
                document.getElementById('recoveryStep2').classList.add('active-step');
                alertBox.style.background = "#d1fae5"; alertBox.style.color = "#065f46"; alertBox.innerText = "OTP Token Sent!";
            } else {
                alertBox.style.background = "#fee2e2"; alertBox.style.color = "#991b1b"; alertBox.innerText = data.message;
            }
        } catch(ex){}
    });

    // Trigger Step 2 Pipeline Call
    document.getElementById('commitPasswordResetBtn').addEventListener('click', async () => {
        const otp = document.getElementById('verificationOtpCode').value.trim();
        const newPass = document.getElementById('recoveryNewPassword').value;
        const alertBox = document.getElementById('recoveryStatusAlert');

        try {
            const res = await fetch("http://localhost:8081/api/auth/reset-password", {
                method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: targetedRecoveryEmail, otpCode: otp, newPassword: newPass })
            });
            const out = await res.json();
            alertBox.style.display = "block";

            if(out.success) {
                alertBox.style.background = "#d1fae5"; alertBox.style.color = "#065f46"; alertBox.innerText = "🎉 Password Reset Successfully! Routing to gateway login screen...";
                setTimeout(() => { window.location.href = "login.html"; }, 2000);
            } else {
                alertBox.style.background = "#fee2e2"; alertBox.style.color = "#991b1b"; alertBox.innerText = out.message;
            }
        } catch(err){}
    });
</script>
</body>
</html>
