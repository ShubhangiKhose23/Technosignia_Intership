<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Registration - SMS Portal</title>
    <!-- Core External Layout Stylesheet Linking -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrapper">
    <h2>Account Registration</h2>
    <form id="registerForm" novalidate>

        <div class="field-group">
            <label>Full Name</label>
            <input type="text" id="studentName" placeholder="Enter full name" required>
        </div>

        <div class="field-group">
            <label>Email Address</label>
            <input type="email" id="studentEmail" placeholder="name@gmail.com" required>
        </div>

        <div class="field-group">
            <label>Mobile Number</label>
            <input type="text" id="studentMobile" placeholder="10-digit mobile number" required>
        </div>

        <div class="field-group">
            <label>Password</label>
            <input type="password" id="studentPassword" placeholder="At least 8 characters" required>
        </div>

        <!-- 🎯 ADDED: CONFIRM PASSWORD INPUT FIELD HERE -->
        <div class="field-group">
            <label>Confirm Password</label>
            <input type="password" id="studentConfirmPassword" placeholder="Confirm your password" required>
        </div>

        <!-- 🛡️ DYNAMIC ACCOUNT ROLE SELECTOR DROPDOWN (ADMIN / USER) -->
        <div class="field-group">
            <label>Account Role</label>
            <select id="userRole" class="form-input-element-field" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                <option value="USER" selected>🎓 Student</option>
                <option value="ADMIN">🛡️ Admin</option>
            </select>
        </div>

        <button type="submit" style="margin-top: 15px;">Register Now</button>
    </form>

    <!-- Global alert dashboard message banner wrapper -->
    <div id="statusAlert" class="alert" style="display: none; padding: 10px; margin-top: 10px; border-radius: 5px;"></div>
</div>

<script src="js/register.js"></script>
</body>
</html>
